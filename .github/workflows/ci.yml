name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax / module-load check
        run: node --check index.js

      - name: Install dependencies and check for drift
        run: |
          npm install
          if [ -n "$(git status --porcelain package.json package-lock.json node_modules)" ]; then
            echo "::error::npm install produced changes that are not committed."
            echo "This repo commits node_modules directly (no bundler) — the" \
                 "runtime it ships must match what 'npm install' produces from" \
                 "package.json/package-lock.json. Run 'npm install' locally and" \
                 "commit the result."
            git status --porcelain package.json package-lock.json node_modules
            git diff --stat -- package.json package-lock.json node_modules
            exit 1
          fi

      - name: Run action — semver path
        run: |
          set +e
          INPUT_TITLE="v1.2.3-beta.1 - test release" \
          INPUT_TOKEN="dummy-token" \
          INPUT_SEMVER="1.2.3-beta.1" \
          INPUT_SEMVER_TYPE="pre-release" \
          INPUT_TAG_PREFIX="v" \
          GITHUB_REPOSITORY="${{ github.repository }}" \
          node index.js > semver-run.log 2>&1
          cat semver-run.log
          if grep -qE "ERR_REQUIRE_ESM|Cannot find module|SyntaxError" semver-run.log; then
            echo "::error::Module loading failed — see log above."
            exit 1
          fi
          if ! grep -q "Creating release with tag: v1.2.3-beta.1 (pre-release: true)" semver-run.log; then
            echo "::error::Expected tag/prerelease log line not found — semver path logic may be broken."
            exit 1
          fi
          echo "semver path OK (API call failure past this point is expected without a real token)"

      - name: Run action — title fallback path
        run: |
          set +e
          INPUT_TITLE="Release: v2.0.0 [hotfix]/patch" \
          INPUT_TOKEN="dummy-token" \
          INPUT_SEMVER="" \
          INPUT_SEMVER_TYPE="" \
          INPUT_TAG_PREFIX="v" \
          GITHUB_REPOSITORY="${{ github.repository }}" \
          node index.js > title-run.log 2>&1
          cat title-run.log
          if grep -qE "ERR_REQUIRE_ESM|Cannot find module|SyntaxError" title-run.log; then
            echo "::error::Module loading failed — see log above."
            exit 1
          fi
          if ! grep -q "Creating release with tag: Releasev2.0.0hotfixpatch (pre-release: false)" title-run.log; then
            echo "::error::Expected tag log line not found — title fallback/stripping logic may be broken."
            exit 1
          fi
          echo "title fallback path OK (API call failure past this point is expected without a real token)"

      - name: action.yml / README input-output consistency
        run: |
          missing=0
          for input in title token semver semver_type tag_prefix; do
            if ! grep -q "\`$input\`" README.md; then
              echo "::error::Input '$input' from action.yml not documented in README.md"
              missing=1
            fi
          done
          for output in release_url tag_name; do
            if ! grep -q "\`$output\`" README.md; then
              echo "::error::Output '$output' from action.yml not documented in README.md"
              missing=1
            fi
          done
          exit $missing
