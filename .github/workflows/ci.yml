name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce PR title convention for the target branch
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" = "main" ]; then
            # Versioned title: "vX.Y.Z - description" or "vX.Y.Z-prerelease.N - description"
            if [[ ! "$TITLE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?[[:space:]]+-[[:space:]]+.+ ]]; then
              echo "::error::PR title \"$TITLE\" targeting main must be versioned: \"vX.Y.Z - description\" (e.g. \"v2.3.1 - new features\"). This drives semver-labeling and create-release."
              exit 1
            fi
          elif [ "$BASE" = "develop" ]; then
            # Conventional Commits: type(scope)!: description
            if [[ ! "$TITLE" =~ ^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-zA-Z0-9_./-]+\))?!?:[[:space:]].+ ]]; then
              echo "::error::PR title \"$TITLE\" targeting develop must follow Conventional Commits, e.g. \"feat: add skip_existing input\" or \"fix(deps): ...\"."
              exit 1
            fi
          fi

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax / module-load check
        run: node --check index.js && node --check src/deriveRelease.js

      - name: Unit tests
        run: npm test

      - name: Build bundle and check for drift
        run: |
          npm run build
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::'npm run build' produced a dist/ that doesn't match what's committed."
            echo "action.yml points at dist/index.js — it must be rebuilt and committed" \
                 "whenever index.js, src/, or a dependency changes. Run 'npm run build'" \
                 "locally and commit the result."
            git status --porcelain dist
            exit 1
          fi

      - name: Run action — semver path
        run: |
          set +e
          INPUT_TITLE="v1.2.3-beta.1 - test release" \
          INPUT_TOKEN="dummy-token" \
          INPUT_SEMVER="1.2.3-beta.1" \
          INPUT_SEMVER_TYPE="pre-release" \
          INPUT_TAG_PREFIX="v" \
          INPUT_SKIP_EXISTING="false" \
          GITHUB_REPOSITORY="${{ github.repository }}" \
          node dist/index.js > semver-run.log 2>&1
          cat semver-run.log
          if grep -qE "ERR_REQUIRE_ESM|Cannot find module|SyntaxError" semver-run.log; then
            echo "::error::Module loading failed — see log above."
            exit 1
          fi
          if ! grep -q "Creating release with tag: v1.2.3-beta.1 (pre-release: true)" semver-run.log; then
            echo "::error::Expected tag/prerelease log line not found — semver path logic may be broken."
            exit 1
          fi
          echo "semver path OK (API call failure past this point is expected without a real token)"

      - name: Run action — title fallback path
        run: |
          set +e
          INPUT_TITLE="Release: v2.0.0 [hotfix]/patch" \
          INPUT_TOKEN="dummy-token" \
          INPUT_SEMVER="" \
          INPUT_SEMVER_TYPE="" \
          INPUT_TAG_PREFIX="v" \
          INPUT_SKIP_EXISTING="false" \
          GITHUB_REPOSITORY="${{ github.repository }}" \
          node dist/index.js > title-run.log 2>&1
          cat title-run.log
          if grep -qE "ERR_REQUIRE_ESM|Cannot find module|SyntaxError" title-run.log; then
            echo "::error::Module loading failed — see log above."
            exit 1
          fi
          if ! grep -q "Creating release with tag: Releasev2.0.0hotfixpatch (pre-release: false)" title-run.log; then
            echo "::error::Expected tag log line not found — title fallback/stripping logic may be broken."
            exit 1
          fi
          echo "title fallback path OK (API call failure past this point is expected without a real token)"

      - name: Run action — invalid semver_type is rejected
        run: |
          set +e
          INPUT_TITLE="irrelevant" \
          INPUT_TOKEN="dummy-token" \
          INPUT_SEMVER="1.0.0" \
          INPUT_SEMVER_TYPE="not-a-real-type" \
          INPUT_TAG_PREFIX="v" \
          INPUT_SKIP_EXISTING="false" \
          GITHUB_REPOSITORY="${{ github.repository }}" \
          node dist/index.js > invalid-run.log 2>&1
          cat invalid-run.log
          if ! grep -q "Invalid semver_type" invalid-run.log; then
            echo "::error::Expected semver_type validation to reject an unknown value."
            exit 1
          fi

      - name: action.yml / README input-output consistency
        run: |
          missing=0
          for input in title token semver semver_type tag_prefix skip_existing; do
            if ! grep -q "\`$input\`" README.md; then
              echo "::error::Input '$input' from action.yml not documented in README.md"
              missing=1
            fi
          done
          for output in release_url tag_name; do
            if ! grep -q "\`$output\`" README.md; then
              echo "::error::Output '$output' from action.yml not documented in README.md"
              missing=1
            fi
          done
          exit $missing
