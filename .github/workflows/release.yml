name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect and label semver
        id: semver
        uses: jkbeeman92/semver-labeling@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        if: steps.semver.outputs.matched == 'true'
        # Runs this repo's own dist/index.js directly (local action reference)
        # rather than pulling jkbeeman92/create-release@v1 from the Marketplace —
        # this repo IS create-release, so releasing itself via its own published
        # tag would make releasing depend on having already released.
        uses: ./
        with:
          title: ${{ github.event.pull_request.title }}
          semver: ${{ steps.semver.outputs.semver }}
          semver_type: ${{ steps.semver.outputs.semver_type }}
          token: ${{ secrets.GITHUB_TOKEN }}
          skip_existing: true
